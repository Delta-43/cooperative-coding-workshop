# Required check for every pull request. Read-only: no secrets, no deploys.
# Each job runs the same commands as the issues' verify lines, once that part of the repo exists.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          if [ -f package.json ]; then npm ci && npm test; else echo "No backend yet."; fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          if [ -f package.json ]; then npm ci && npm run lint && npm run build; else echo "No frontend yet."; fi

# Builds demo/frontend/ and publishes it to GitHub Pages on every push to main that changes it.
name: Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["demo/frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # Pages serves the site from /<repo-name>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # Optional repository variables: a test Worker, and a short join link (for example bit.ly) for the lobby.
          VITE_BACKEND_URL: ${{ vars.BACKEND_URL }}
          VITE_SHORT_URL: ${{ vars.SHORT_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
